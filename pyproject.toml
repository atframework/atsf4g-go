[project]
name = "atsf4g-go-tooling"
version = "0.1.0"
description = "Python tooling for xresloader config conversion, Mako RPC/DB codegen, and MkDocs documentation."
requires-python = ">=3.10"
dependencies = [
    "Mako>=1.2.1",
    "six>=1.16.0",
    "protobuf>=4.21.4",
    "PyYAML>=6.0.3",
]

[dependency-groups]
docs = [
    "mkdocs>=1.5.3",
    "mkdocs-material>=9.5.3",
    "mkdocs-git-revision-date-localized-plugin>=1.2.2",
    "mkdocs-minify-plugin>=0.7.2",
    "pymdown-extensions>=10.5",
    "markdown>=3.5.1",
    "mkdocs-awesome-pages-plugin>=2.9.2",
    "mkdocs-redirects>=1.2.1",
    "mkdocs-macros-plugin>=1.0.5",
    "mkdocs-mermaid2-plugin>=1.1.1",
    "mkdocs-excalidraw>=0.1.0",
    "mkdocs-drawio>=0.1.0",
    "mkdocs-glightbox>=0.5.0",
]
